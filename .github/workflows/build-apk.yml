name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, v1-full-alert-system ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore Firebase Android configuration
        shell: bash
        env:
          FIREBASE_ANDROID_JSON: ${{ secrets.FIREBASE_ANDROID_JSON }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_ANDROID_JSON" ]; then
            printf '%s' "$FIREBASE_ANDROID_JSON" > app/google-services.json
            test -s app/google-services.json
            echo "Firebase Android configuration restored."
          else
            echo "FIREBASE_ANDROID_JSON secret not configured; building without Firebase runtime configuration."
          fi

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-37.2"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Configure Supabase build properties
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          printf "SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties
          test -s local.properties

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true

      - name: Type-check Supabase Edge Function
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/dispatch-alert/index.ts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alert-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
